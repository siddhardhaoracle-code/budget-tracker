<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #333;
      min-height: 100vh;
      padding: 30px 16px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #2d3748;
      margin-bottom: 24px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Balance Card */
    .balance-card {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }

    .balance-card p {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .balance-card h2 {
      font-size: 2.6rem;
      font-weight: 700;
    }

    .summary {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    .summary-item p { font-size: 0.8rem; opacity: 0.8; }
    .summary-item h3 { font-size: 1.2rem; font-weight: 600; }

    /* Form */
    .form-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .form-card h3 {
      margin-bottom: 16px;
      font-size: 1.1rem;
      color: #4a5568;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    input, select {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      border-color: #667eea;
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-add:hover { opacity: 0.9; }

    /* Entries */
    .entries-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .entries-card h3 {
      margin-bottom: 16px;
      font-size: 1.1rem;
      color: #4a5568;
    }

    .entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0f4f8;
    }

    .entry:last-child { border-bottom: none; }

    .entry-info { flex: 1; }
    .entry-desc { font-weight: 600; font-size: 0.95rem; }
    .entry-type {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .entry-amount {
      font-size: 1.1rem;
      font-weight: 700;
      margin-right: 14px;
    }

    .income .entry-type { color: #48bb78; }
    .income .entry-amount { color: #48bb78; }
    .expense .entry-type { color: #fc8181; }
    .expense .entry-amount { color: #fc8181; }

    .btn-delete {
      background: #fff5f5;
      color: #fc8181;
      border: 1px solid #fed7d7;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-delete:hover { background: #fed7d7; }

    .empty-msg {
      text-align: center;
      color: #a0aec0;
      padding: 20px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💰 Budget Tracker</h1>

    <!-- Balance Card -->
    <div class="balance-card">
      <p>Current Balance</p>
      <h2 id="balance">₹0.00</h2>
      <div class="summary">
        <div class="summary-item">
          <p>⬆ Income</p>
          <h3 id="total-income">₹0.00</h3>
        </div>
        <div class="summary-item">
          <p>⬇ Expenses</p>
          <h3 id="total-expense">₹0.00</h3>
        </div>
      </div>
    </div>

    <!-- Add Entry Form -->
    <div class="form-card">
      <h3>Add New Entry</h3>
      <div class="form-row">
        <input type="text" id="desc" placeholder="Description (e.g. Salary, Rent)" />
        <input type="number" id="amount" placeholder="Amount" min="0" />
      </div>
      <div class="form-row">
        <select id="type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <button class="btn-add" onclick="addEntry()">+ Add Entry</button>
    </div>

    <!-- Entries List -->
    <div class="entries-card">
      <h3>Transactions</h3>
      <div id="entries-list">
        <p class="empty-msg">No entries yet. Add your first transaction above!</p>
      </div>
    </div>
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('budget-entries') || '[]');

    function save() {
      localStorage.setItem('budget-entries', JSON.stringify(entries));
    }

    function formatCurrency(amount) {
      return '₹' + parseFloat(amount).toFixed(2);
    }

    function updateSummary() {
      const income  = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
      const expense = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
      const balance = income - expense;

      document.getElementById('balance').textContent       = formatCurrency(balance);
      document.getElementById('total-income').textContent  = formatCurrency(income);
      document.getElementById('total-expense').textContent = formatCurrency(expense);
    }

    function renderEntries() {
      const list = document.getElementById('entries-list');
      if (entries.length === 0) {
        list.innerHTML = '<p class="empty-msg">No entries yet. Add your first transaction above!</p>';
        return;
      }

      list.innerHTML = [...entries].reverse().map((e, i) => `
        <div class="entry ${e.type}">
          <div class="entry-info">
            <div class="entry-desc">${e.desc}</div>
            <div class="entry-type">${e.type}</div>
          </div>
          <div class="entry-amount">${e.type === 'income' ? '+' : '-'}${formatCurrency(e.amount)}</div>
          <button class="btn-delete" onclick="deleteEntry(${entries.length - 1 - i})">Delete</button>
        </div>
      `).join('');
    }

    function addEntry() {
      const desc   = document.getElementById('desc').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const type   = document.getElementById('type').value;

      if (!desc) { alert('Please enter a description.'); return; }
      if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }

      entries.push({ desc, amount, type });
      save();
      renderEntries();
      updateSummary();

      document.getElementById('desc').value   = '';
      document.getElementById('amount').value = '';
    }

    function deleteEntry(index) {
      entries.splice(index, 1);
      save();
      renderEntries();
      updateSummary();
    }

    // Init
    renderEntries();
    updateSummary();
  </script>

</body>
</html>
